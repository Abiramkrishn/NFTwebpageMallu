<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50">
  <defs>
    <linearGradient id="theyyamFlame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D50000"/>
      <stop offset="35%" stop-color="#FF3D00"/>
      <stop offset="70%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFEA00"/>
    </linearGradient>
    <linearGradient id="theyyamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF6D00"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sacred Theyyam Flame Crest / Mudi Crown Icon -->
  <g transform="translate(6, 3)">
    <!-- Ambient Radiance Aura -->
    <circle cx="21" cy="22" r="19" fill="#FF3D00" fill-opacity="0.18"/>
    
    <!-- Outer Halo Crown Arch -->
    <path d="M 4 24 C 4 11 11 4 21 4 C 31 4 38 11 38 24" fill="none" stroke="url(#theyyamGold)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1.5 4.5"/>

    <!-- Sacred Ritual Flame Crest -->
    <path d="M 21 1 C 26 9 33 16 31 27 C 29 34 25 39 21 40 C 17 39 13 34 11 27 C 9 16 16 9 21 1 Z" fill="url(#theyyamFlame)" filter="url(#softGlow)"/>
    
    <!-- Inner Radiant Core Flame -->
    <path d="M 21 12 C 24 17 26 22 24 28 C 23 32 22 34 21 34 C 20 34 19 32 18 28 C 16 22 18 17 21 12 Z" fill="#FFF9C4"/>
    
    <!-- Third Eye / Bindu Motif -->
    <polygon points="21,19 23.5,23 21,27 18.5,23" fill="#B71C1C"/>
    <circle cx="21" cy="23" r="1" fill="#FFD700"/>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(56, 0)">
    <!-- THEYYAM -->
    <text x="0" y="24" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="4" fill="#FFFFFF">THEYYAM</text>
    
    <!-- NFT MALLU Cyber-Pill -->
    <rect x="0" y="31" width="112" height="15" rx="3.5" fill="#FF3D00" fill-opacity="0.2" stroke="#FF6D00" stroke-width="1"/>
    <text x="8" y="42" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2.2" fill="#FFA726">NFT MALLU</text>
    <circle cx="102" cy="38.5" r="2.5" fill="#00E676"/>
  </g>
</svg>
